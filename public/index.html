<style>
  /* ================================================================
     TOKENS
     ================================================================ */
  :root {
    --ground:#F4F3F8; --surface:#FFF; --sunk:#EAE8F2;
    --ink:#1C1A2E; --ink-mid:#4E4A66; --ink-soft:#7C7891;
    --rule:#E3E1EC; --rule-2:#CBC7DC;
    --anchor:#4F4593; --anchor-deep:#382F6E; --wash:#EDEBF8; --petal:#7D71C4;
    --warn-bg:#FBF4E6; --warn-rule:#E7D8B4; --warn-ink:#6E5720;
    --stop-bg:#FBECEF; --stop-rule:#E9C2CC; --stop-ink:#8B2F47;
    --ok-bg:#E8F5E9; --ok-rule:#A5D6A7; --ok-ink:#2E7D32;
    --serif:"Newsreader",Georgia,serif; --sans:"Inter",-apple-system,sans-serif;
    --shadow-sm:0 1px 3px rgba(0,0,0,.06);
    --shadow-md:0 4px 16px rgba(0,0,0,.08);
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){
    :root[data-theme="auto"]{
      --ground:#131221; --surface:#1C1A2E; --sunk:#171626;
      --ink:#E8E6F2; --ink-mid:#ADA8C4; --ink-soft:#817CA0;
      --rule:#2C2942; --rule-2:#3D3959;
      --anchor:#A79DE8; --anchor-deep:#C3BCF3; --wash:#232040; --petal:#9C90DC;
      --warn-bg:#241E10; --warn-rule:#463A22; --warn-ink:#DBC189;
      --stop-bg:#2B1520; --stop-rule:#4C2537; --stop-ink:#E9A0B4;
      --ok-bg:#1B2E1B; --ok-rule:#2E5C2E; --ok-ink:#81C784;
    }
  }
  :root[data-theme="dark"]{
    --ground:#131221; --surface:#1C1A2E; --sunk:#171626;
    --ink:#E8E6F2; --ink-mid:#ADA8C4; --ink-soft:#817CA0;
    --rule:#2C2942; --rule-2:#3D3959;
    --anchor:#A79DE8; --anchor-deep:#C3BCF3; --wash:#232040; --petal:#9C90DC;
    --warn-bg:#241E10; --warn-rule:#463A22; --warn-ink:#DBC189;
    --stop-bg:#2B1520; --stop-rule:#4C2537; --stop-ink:#E9A0B4;
    --ok-bg:#1B2E1B; --ok-rule:#2E5C2E; --ok-ink:#81C784;
  }
  :root[data-theme="light"]{
    --ground:#F4F3F8; --surface:#FFF; --sunk:#EAE8F2;
    --ink:#1C1A2E; --ink-mid:#4E4A66; --ink-soft:#7C7891;
    --rule:#E3E1EC; --rule-2:#CBC7DC;
    --anchor:#4F4593; --anchor-deep:#382F6E; --wash:#EDEBF8; --petal:#7D71C4;
    --warn-bg:#FBF4E6; --warn-rule:#E7D8B4; --warn-ink:#6E5720;
    --stop-bg:#FBECEF; --stop-rule:#E9C2CC; --stop-ink:#8B2F47;
    --ok-bg:#E8F5E9; --ok-rule:#A5D6A7; --ok-ink:#2E7D32;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none}
  .page{max-width:660px;margin:0 auto;padding:0 22px 90px;position:relative}

  /* ================================================================
     OFFLINE BANNER
     ================================================================ */
  .offline-banner{display:none;background:var(--stop-bg);border:1px solid var(--stop-rule);
    color:var(--stop-ink);border-radius:9px;padding:10px 16px;font-size:13px;
    font-weight:500;margin:12px 0 -6px;text-align:center}
  body.offline .offline-banner{display:block}

  /* ================================================================
     MASTHEAD
     ================================================================ */
  .top{padding:42px 0 18px;display:flex;align-items:flex-start;justify-content:space-between;
    gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px}
  h1{font-family:var(--serif);font-size:clamp(32px,7vw,42px);font-weight:400;
    line-height:1;letter-spacing:-.02em;margin:0}
  .tag{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;color:var(--anchor);margin:4px 0 0 45px}

  /* Theme toggle */
  .themebar{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:8px}
  .themebar button{border:0;background:transparent;color:var(--ink-soft);
    font-family:var(--sans);font-size:12px;font-weight:500;padding:6px 10px;
    border-radius:6px;cursor:pointer;transition:all .16s}
  .themebar button:hover{color:var(--anchor)}
  .themebar button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
    box-shadow:var(--shadow-sm)}

  /* ================================================================
     NOTICE
     ================================================================ */
  .notice{background:var(--warn-bg);border:1px solid var(--warn-rule);color:var(--warn-ink);
    border-radius:9px;padding:13px 16px;font-size:13.5px;line-height:1.55;margin:18px 0 22px}
  .notice b{font-weight:600}
  .notice details{margin-top:7px}
  .notice summary{cursor:pointer;font-size:12.5px;opacity:.85}
  .notice details p{margin:8px 0 0;font-size:12.5px;line-height:1.55}

  /* ================================================================
     MODE SWITCHER
     ================================================================ */
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
    background:var(--sunk);padding:5px;border-radius:11px;margin-bottom:20px;
    position:sticky;top:8px;z-index:10;backdrop-filter:blur(8px)}
  .mode{border:0;background:transparent;color:var(--ink-mid);font-family:var(--sans);
    font-size:13.5px;font-weight:500;padding:10px 6px;border-radius:8px;cursor:pointer;
    transition:background .16s,color .16s}
  .mode:hover{color:var(--anchor)}
  .mode[aria-selected="true"]{background:var(--surface);color:var(--ink);
    box-shadow:var(--shadow-sm)}
  .mode:focus-visible{outline:2px solid var(--anchor);outline-offset:2px}

  /* ================================================================
     PANELS
     ================================================================ */
  .panel[hidden]{display:none}
  .panel{margin-bottom:26px;animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .lede{font-family:var(--serif);font-size:17px;color:var(--ink-mid);
    margin:0 0 18px;line-height:1.5}

  /* Chips */
  .grp{margin-bottom:16px}
  .grp-label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);
    margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--sans);font-size:13.5px;color:var(--ink-mid);background:var(--surface);
    border:1px solid var(--rule-2);border-radius:20px;padding:7px 14px;cursor:pointer;
    transition:all .16s;user-select:none}
  .chip:hover{border-color:var(--anchor);color:var(--anchor)}
  .chip[aria-pressed="true"]{background:var(--anchor);border-color:var(--anchor);color:#fff}
  .chip:focus-visible{outline:2px solid var(--anchor);outline-offset:2px}
  @media(prefers-color-scheme:dark){.chip[aria-pressed="true"]{color:#14121F}}
  :root[data-theme="dark"] .chip[aria-pressed="true"]{color:#14121F}

  /* Buttons */
  .primary{width:100%;border:0;background:var(--anchor);color:#fff;font-family:var(--sans);
    font-size:15px;font-weight:500;padding:13px;border-radius:9px;cursor:pointer;
    transition:background .18s,transform .1s}
  .primary:hover{background:var(--anchor-deep)}
  .primary:active{transform:scale(.985)}
  .primary:focus-visible{outline:2px solid var(--anchor);outline-offset:2px}
  @media(prefers-color-scheme:dark){.primary{color:#14121F}}
  :root[data-theme="dark"] .primary{color:#14121F}

  /* ================================================================
     FIB-4 CALCULATOR
     ================================================================ */
  .calc-note{background:var(--wash);border-radius:8px;padding:11px 14px;font-size:12.5px;
    line-height:1.55;color:var(--ink-mid);margin-bottom:18px}
  .inputs{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:16px}
  .inp label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);
    margin-bottom:5px}
  .inp .unit{font-weight:400;opacity:.75}
  .inp input{width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);
    background:var(--surface);border:1.5px solid var(--rule-2);border-radius:8px;
    padding:11px 12px;transition:border-color .2s,box-shadow .2s}
  .inp input:focus{outline:none;border-color:var(--anchor);box-shadow:0 0 0 3px var(--wash)}
  .inp input.invalid{border-color:var(--stop-ink);background:var(--stop-bg)}
  .inp .hint{font-size:11.5px;color:var(--stop-ink);margin-top:4px;display:none}
  .inp.invalid .hint{display:block}

  .result{margin-top:18px;border-radius:10px;padding:16px 18px;display:none}
  .result.show{display:block;animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .result .score{font-family:var(--serif);font-size:30px;line-height:1;margin:0 0 4px}
  .result .band{font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
    margin-bottom:10px}
  .result p{font-size:14px;line-height:1.6;margin:0 0 9px}
  .result p:last-child{margin-bottom:0}
  .r-low{background:var(--wash);border:1px solid var(--rule-2)}
  .r-mid{background:var(--warn-bg);border:1px solid var(--warn-rule);color:var(--warn-ink)}
  .r-high{background:var(--stop-bg);border:1px solid var(--stop-rule);color:var(--stop-ink)}
  .r-na{background:var(--sunk);border:1px solid var(--rule)}
  .ask-about{margin-top:12px;font-size:13.5px}

  /* ================================================================
     STARTERS
     ================================================================ */
  .slips{display:grid;gap:7px}
  .slip{display:block;width:100%;text-align:left;background:var(--surface);
    border:1px solid var(--rule);border-left:2px solid var(--rule-2);border-radius:0 8px 8px 0;
    padding:12px 15px;font-family:var(--serif);font-size:16px;color:var(--ink);cursor:pointer;
    transition:all .16s}
  .slip:hover{border-left-color:var(--anchor);background:var(--wash);transform:translateX(2px)}
  .slip:focus-visible{outline:2px solid var(--anchor);outline-offset:2px}

  /* ================================================================
     THREAD & TURNS
     ================================================================ */
  .turn{margin-bottom:28px;position:relative}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:no-preference){.turn{animation:rise .35s ease-out both}}
  .turn-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding-left:14px}
  .turn-time{font-size:11px;color:var(--ink-soft);font-family:var(--sans)}
  .q{font-family:var(--serif);font-size:19px;line-height:1.35;padding-left:14px;
    border-left:2px solid var(--anchor);margin:0 0 10px}
  .answer{font-family:var(--serif);font-size:17.5px;line-height:1.68}
  .answer p{margin:0 0 14px}
  .answer p:last-child{margin-bottom:0}
  .answer ul,.answer ol{margin:14px 0;padding-left:21px}
  .answer li{margin-bottom:7px}
  .answer h3{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-soft);margin:22px 0 9px}
  .answer a{color:var(--anchor)}
  .answer code{background:var(--sunk);padding:2px 5px;border-radius:4px;font-size:.9em;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .answer pre{background:var(--sunk);padding:12px;border-radius:8px;overflow-x:auto;
    font-size:13.5px;line-height:1.5}
  .answer pre code{background:none;padding:0}

  .ref{display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:600;
    color:var(--anchor);background:var(--wash);border-radius:4px;padding:1px 5px;margin:0 1px;
    vertical-align:1px;text-decoration:none;cursor:pointer}
  .ref:hover{background:var(--anchor);color:var(--surface)}

  /* Sources - collapsible */
  .cites{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
  .cites-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:11px;
    cursor:pointer;user-select:none}
  .cites-h::before{content:"▸";display:inline-block;transition:transform .2s}
  .cites.open .cites-h::before{transform:rotate(90deg)}
  .cites-body{display:grid;gap:8px;max-height:0;overflow:hidden;transition:max-height .3s ease}
  .cites.open .cites-body{max-height:2000px}
  .cite{display:grid;grid-template-columns:24px 1fr;gap:4px;font-size:13px;
    line-height:1.45;border-radius:6px;padding:4px 0}
  .cite-n{color:var(--ink-soft);font-size:11px;padding-top:2px}
  .cite a{color:var(--ink-mid);text-decoration:none;border-bottom:1px solid var(--rule-2)}
  .cite a:hover{color:var(--anchor)}
  .cite-m{color:var(--ink-soft);font-size:12px}
  .cite.flash{background:var(--wash);transition:background .8s}

  /* Retry on failed turn */
  .turn-actions{display:flex;gap:8px;margin-top:10px;padding-left:14px}
  .turn-actions button{font-family:var(--sans);font-size:12px;font-weight:500;
    color:var(--ink-mid);background:var(--surface);border:1px solid var(--rule-2);
    border-radius:6px;padding:6px 12px;cursor:pointer;transition:all .16s}
  .turn-actions button:hover{border-color:var(--anchor);color:var(--anchor)}

  /* ================================================================
     THINKING / ERROR
     ================================================================ */
  .thinking{font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:9px}
  .pulse{width:6px;height:6px;border-radius:50%;background:var(--anchor)}
  @media(prefers-reduced-motion:no-preference){
    @keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}
    .pulse{animation:breathe 1.4s ease-in-out infinite}}
  .failed{background:var(--stop-bg);border:1px solid var(--stop-rule);color:var(--stop-ink);
    border-radius:8px;padding:13px 16px;font-size:14px}
  .failed .err-code{font-size:11px;opacity:.7;margin-top:4px;font-family:ui-monospace,monospace}

  /* ================================================================
     COMPOSER
     ================================================================ */
  .composer{position:sticky;bottom:0;
    background:linear-gradient(to bottom,transparent,var(--ground) 22%);
    padding:20px 0 14px;margin-top:30px;z-index:20}
  .cbox{display:flex;gap:8px;align-items:flex-end;background:var(--surface);
    border:1px solid var(--rule-2);border-radius:var(--radius);padding:6px 6px 6px 14px;
    transition:border-color .18s,box-shadow .18s}
  .cbox:focus-within{border-color:var(--anchor);box-shadow:0 0 0 3px var(--wash)}
  textarea{flex:1;border:0;background:transparent;color:var(--ink);font-family:var(--serif);
    font-size:16.5px;line-height:1.5;padding:9px 0;resize:none;min-height:42px;max-height:180px}
  textarea:focus{outline:none}
  textarea::placeholder{color:var(--ink-soft)}
  .send{flex-shrink:0;border:0;background:var(--anchor);color:#fff;font-family:var(--sans);
    font-size:14px;font-weight:500;padding:11px 18px;border-radius:8px;cursor:pointer;
    transition:background .18s,transform .1s}
  .send:hover:not(:disabled){background:var(--anchor-deep)}
  .send:active:not(:disabled){transform:scale(.96)}
  .send:disabled{opacity:.4;cursor:default}
  @media(prefers-color-scheme:dark){.send{color:#14121F}}
  :root[data-theme="dark"] .send{color:#14121F}

  .composer-meta{display:flex;justify-content:space-between;align-items:center;
    margin-top:6px;padding:0 4px}
  .composer-hint{font-size:11px;color:var(--ink-soft)}
  .composer-hint kbd{background:var(--sunk);border:1px solid var(--rule-2);
    border-radius:4px;padding:1px 5px;font-size:10px;font-family:ui-monospace,monospace}

  /* ================================================================
     SCROLL-TO-BOTTOM
     ================================================================ */
  .scroll-bottom{position:fixed;right:22px;bottom:110px;width:40px;height:40px;
    border-radius:50%;border:1px solid var(--rule-2);background:var(--surface);
    color:var(--ink-mid);display:none;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:var(--shadow-md);z-index:30;transition:all .2s}
  .scroll-bottom:hover{color:var(--anchor);border-color:var(--anchor)}
  .scroll-bottom.show{display:flex}

  /* ================================================================
     ACTION BAR
     ================================================================ */
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 20px}
  .action{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-mid);
    background:var(--surface);border:1px solid var(--rule);border-radius:7px;
    padding:7px 12px;cursor:pointer;transition:all .16s}
  .action:hover{border-color:var(--anchor);color:var(--anchor)}
  .action:focus-visible{outline:2px solid var(--anchor);outline-offset:2px}
  .actions[hidden]{display:none}

  /* ================================================================
     FOOTER
     ================================================================ */
  .foot{margin-top:38px;padding-top:18px;border-top:1px solid var(--rule);
    font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
  .foot p{margin:0 0 7px}
  .foot button{background:none;border:0;color:var(--ink-soft);font-family:var(--sans);
    font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0}
  .foot button:hover{color:var(--anchor)}

  /* ================================================================
     PRINT
     ================================================================ */
  @media print{
    @page{margin:18mm}
    body{background:#fff;color:#000;font-size:11pt}
    .page{max-width:none;padding:0}
    .modes,.panel,.composer,.notice details,.foot button,.actions,.scroll-bottom,
    .themebar,.offline-banner,.composer-meta{display:none!important}
    .top{padding:0 0 12pt;border-bottom:1px solid #999}
    .brand svg{width:26px;height:26px}
    h1{font-size:20pt}
    .tag{margin-left:37px;color:#444}
    .notice{border:1px solid #999;background:#fff;color:#000;font-size:9.5pt;
      page-break-inside:avoid}
    .turn{page-break-ins
